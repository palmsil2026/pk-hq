# ============================================================
#  แอปโรงขวด v2 — ตรวจทุก push บน pk-app-v2 (ไม่แตะ main · ไม่แตะ deploy-gas.yml)
#   test  : ตรวจไวยากรณ์/ไฟล์สร้างอัตโนมัติ + เทสต์หลังบ้าน (D1 จำลอง) + สะพาน GAS (gas/Code.gs ตัวจริงเทียบกับ main)
#   ui    : เทสต์หน้าจอ Playwright (320 · 360 · 390 · 1366) + ภาพหน้าจอ (ดาวน์โหลดได้จากหน้า Actions)
#   build : ให้ wrangler ประกอบ Pages Functions (โค้ดต้องรันบน Workers ได้ ไม่ใช่แค่ใน Node)
#   deploy-cloudflare : ขึ้นพรีวิว Cloudflare — ข้ามเองถ้ายังไม่มี secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# ============================================================
name: v2 CI (โรงขวด v2)
on:
  push:
    branches: [pk-app-v2]
    paths:
      - 'v2/**'
      - 'gas/Code.gs'
      - 'docs/products/products-master.csv'
      - '.github/workflows/v2-ci.yml'
  workflow_dispatch:
concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ต้องมี origin/main — เทสต์เทียบ action เดิมของ gas/Code.gs กับรุ่นที่ขึ้นจริง
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: ตรวจไวยากรณ์ · ไม่มี DELETE · ไม่มีอีโมจิ · ไม่มีความลับ · tokens/migration/ทะเบียนตรงต้นทาง
        run: node v2/tools/check.mjs
      - name: เทสต์หลังบ้าน + สคีมา + สะพาน GAS + ตัวนำเข้า
        working-directory: v2
        run: node --no-warnings --test tests/*.test.mjs
  ui:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: ติดตั้ง Playwright + Chromium (เฉพาะเครื่อง GitHub)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$i" = 3 ] && exit 1; sleep 20; done
      - name: เทสต์หน้าจอ (ทุกบทบาท · 320/360/390/1366 · โหมดมืด · reduced-motion)
        run: node --no-warnings --test v2/tests/ui/run.mjs
      - name: ภาพหน้าจอ (ข้อมูลสมมติ)
        run: node --no-warnings v2/tools/shots.mjs "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: v2-shots
          path: ${{ runner.temp }}/shots
          retention-days: 14
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: wrangler ประกอบ Pages Functions ได้ (ตรวจว่ารันบน Workers runtime ได้)
        working-directory: v2
        run: npx --yes wrangler@4 pages functions build --outdir "$RUNNER_TEMP/fn" && test -s "$RUNNER_TEMP/fn/index.js"
  deploy-cloudflare:
    needs: [test, ui, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: v2-deploy
      cancel-in-progress: false
    steps:
      - name: มีกุญแจ Cloudflare หรือยัง (ไม่มี = ข้าม ไม่แดง)
        id: has
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; echo "::notice::ยังไม่มี secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — ข้ามการขึ้น Cloudflare (ดู v2/README.md › สิ่งที่คุณปาล์มต้องทำเอง)"; fi
      - uses: actions/checkout@v5
        if: steps.has.outputs.go == '1'
      - uses: actions/setup-node@v5
        if: steps.has.outputs.go == '1'
        with:
          node-version: '22'
      - name: ขึ้นพรีวิว Cloudflare (Pages pk-v2 + D1 pk-v2 · migration · smoke /api/health)
        if: steps.has.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PK_TICKET_KEY: ${{ secrets.PK_TICKET_KEY }}
          PK_SYNC_KEY: ${{ secrets.PK_SYNC_KEY }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: bash v2/tools/deploy-cf.sh
      - name: นาฬิกาปลุกซิงก์ชีทบัญชีวันละครั้ง (Worker pk-v2-cron · 20:00 ไทย · ไม่มี PK_SYNC_KEY = ข้าม)
        if: steps.has.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PK_SYNC_KEY: ${{ secrets.PK_SYNC_KEY }}
        run: bash v2/tools/deploy-cron.sh
