<title>จัดสายส่ง โรงขวด P&amp;K</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: tool screen. Desktop = tray of unscheduled orders on the left + 7 day columns. Phone = day strip + one day at a time, tray as a tab. Tokens = P&K v2 design system (brick red, warm neutrals). */
:root{
  --bg:#FFF8F2; --surface:#FFFFFF; --surface-2:#FBF2EA; --sunken:#F5ECE5;
  --ink:#201A15; --ink-2:#6B645E; --line:#EAE1D9; --edge:#7D756F;
  --brand:#B24A4F; --on-brand:#FFFFFF; --brand-ink:#702F32; --brand-soft:#FFE8E7; --brand-tint:#FFF7F7;
  --ok:#236F3B; --ok-soft:#D1FAD8; --warn:#B45309; --warn-soft:#FFE9DE; --bad:#B91C1C; --bad-soft:#FFE8E5;
  --scrim:rgba(26,18,18,.40);
  --elev-1:0 1px 2px rgba(32,22,22,.06),0 1px 3px rgba(32,22,22,.08);
  --elev-3:0 2px 4px rgba(32,22,22,.08),0 10px 24px rgba(32,22,22,.16);
  --font-display:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --font-body:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --tap:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#201A15; --surface:#2B241F; --surface-2:#362F29; --sunken:#1A1511;
  --ink:#FBF2EA; --ink-2:#CDC5BD; --line:#413A34; --edge:#978F88;
  --brand:#FAB0AF; --on-brand:#401618; --brand-ink:#FFD8D7; --brand-soft:#5F2729; --brand-tint:#4F1E21;
  --ok:#9ED7A9; --ok-soft:#0C3A1B; --warn:#F9B591; --warn-soft:#4F2203; --bad:#FFAFA5; --bad-soft:#5A1310;
  --scrim:rgba(0,0,0,.55); --elev-1:0 1px 2px rgba(0,0,0,.4); --elev-3:0 10px 28px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#201A15; --surface:#2B241F; --surface-2:#362F29; --sunken:#1A1511;
  --ink:#FBF2EA; --ink-2:#CDC5BD; --line:#413A34; --edge:#978F88;
  --brand:#FAB0AF; --on-brand:#401618; --brand-ink:#FFD8D7; --brand-soft:#5F2729; --brand-tint:#4F1E21;
  --ok:#9ED7A9; --ok-soft:#0C3A1B; --warn:#F9B591; --warn-soft:#4F2203; --bad:#FFAFA5; --bad-soft:#5A1310;
  --scrim:rgba(0,0,0,.55); --elev-1:0 1px 2px rgba(0,0,0,.4); --elev-3:0 10px 28px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.week{font-family:var(--font-display);font-weight:600;color:var(--ink-2);font-size:15px}
.sample{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:2px 9px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--elev-1)}
.btn{min-height:var(--tap);padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--font-display);font-weight:700}
.stat.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.stat.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pub{font-size:13px;color:var(--ink-2)}
.pub b{color:var(--ok)}

/* board */
.board{display:grid;grid-template-columns:262px minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.tray{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100vh - 150px);overflow:auto;background:var(--surface-2);border-radius:var(--r-lg);padding:12px;display:grid;gap:10px}
.tray h2,.mh{font-family:var(--font-display);font-size:16px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.cnt{font-size:12px;font-weight:700;background:var(--brand);color:var(--on-brand);border-radius:99px;padding:1px 8px}
.hint{font-size:13px;color:var(--ink-2)}
.grp{display:grid;gap:6px}
.grph{display:flex;align-items:center;gap:4px 6px;font-weight:600;font-size:14px;flex-wrap:wrap}
.grph small{color:var(--ink-2);font-weight:400}
.grph .btn{margin-left:auto}
.days{overflow-x:auto;padding-bottom:8px}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(146px,1fr));gap:8px;min-width:1080px}
.day{background:var(--surface-2);border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:520px;border:2px solid transparent;transition:border-color .12s}
.day.over,.tray.over{border-color:var(--brand)}
.tray{border:2px solid transparent}
.dh{padding:10px 10px 8px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.dname{display:flex;align-items:baseline;gap:6px}
.dname b{font-family:var(--font-display);font-size:20px;font-weight:800}
.dname span{color:var(--ink-2);font-size:13px}
.dname .today{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);padding:1px 7px;border-radius:99px}
.pins{display:flex;flex-wrap:wrap;gap:4px}
.pin{font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--brand-soft);color:var(--brand-ink);border:0;min-height:26px}
.pin.daily{background:var(--sunken);color:var(--ink-2)}
.pin.add{background:transparent;border:1px dashed var(--edge);color:var(--ink-2)}
.dsum{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .r{background:var(--ok)}.bar .s{background:var(--warn)}.bar .x{background:var(--bad)}
.db{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.alab{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:6px}
.alab .off{color:var(--warn);font-weight:600;letter-spacing:0}
.empty{font-size:13px;color:var(--ink-2);text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:var(--r-md)}

/* card */
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--elev-1);padding:8px 10px 8px 12px;display:grid;gap:2px;cursor:pointer;position:relative;border:1px solid var(--line);text-align:left;width:100%}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--edge)}
.card.st-ready::before{background:var(--ok)}.card.st-screen::before{background:var(--warn)}.card.st-short::before{background:var(--bad)}.card.st-none::before{background:var(--line)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.4}
.c1{display:flex;align-items:baseline;gap:6px}
.cust{font-weight:600;font-size:14.5px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bags{margin-left:auto;font-family:var(--font-display);font-weight:700;font-size:14px;white-space:nowrap}
.c2{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.c3{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:0 6px;line-height:1.6}
.tag.ready{background:var(--ok-soft);color:var(--ok)}.tag.screen{background:var(--warn-soft);color:var(--warn)}.tag.short{background:var(--bad-soft);color:var(--bad)}
.tag.plain{background:var(--sunken);color:var(--ink-2)}.tag.urgent{background:var(--brand-soft);color:var(--brand-ink)}

/* need view */
.need{display:grid;gap:18px;margin-top:14px}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:grid;gap:10px;align-content:start}
.panel h3{font-family:var(--font-display);font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.panel h3 .who{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--ink-2)}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2)}
.li .k{font-family:var(--font-display);font-weight:700;min-width:70px}
.sday{display:grid;gap:4px}
.sday h4{margin:4px 0 0;font-family:var(--font-display);font-size:14px;display:flex;gap:8px;align-items:baseline}
.sday h4 small{font-family:var(--font-body);font-weight:400;color:var(--ink-2);font-size:12.5px}
.srow{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:8px;background:var(--surface-2);font-size:14px}
.srow .c{font-weight:600;min-width:92px}
.srow .p{flex:1;min-width:0;color:var(--ink-2)}
.srow .v{font-family:var(--font-display);font-weight:800;color:var(--warn)}
.li .d{flex:1;min-width:0}
.li .d small{display:block;color:var(--ink-2);font-size:12.5px}
.li .v{font-family:var(--font-display);font-weight:800;font-size:17px;white-space:nowrap}
.li.bad .v{color:var(--bad)}.li.warn .v{color:var(--warn)}
.okmsg{font-size:14px;color:var(--ok);background:var(--ok-soft);border-radius:var(--r-md);padding:10px}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--font-display);font-size:13px;color:var(--ink-2);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .cell{display:inline-block;min-width:44px;padding:1px 6px;border-radius:6px;font-weight:600}
.cell.r{background:var(--ok-soft);color:var(--ok)}.cell.s{background:var(--warn-soft);color:var(--warn)}.cell.x{background:var(--bad-soft);color:var(--bad)}
td.z{color:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--surface);box-shadow:var(--elev-3);display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (min-width:761px){.sheet{top:0;right:0;bottom:0;width:400px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}}
@media (max-width:760px){.sheet{left:0;right:0;bottom:0;max-height:86%;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.sheet h3{font-family:var(--font-display);font-size:20px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--ink-2);font-size:13.5px}
.items{display:grid;gap:6px}
.it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2)}
.it .d{flex:1;min-width:0}
.it .d small{display:block;color:var(--ink-2);font-size:12.5px}
.sl{font-family:var(--font-display);font-size:14px;font-weight:600;margin:4px 0 0}
.dayc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dayc button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;line-height:1.2;padding:4px}
.dayc button b{font-family:var(--font-display);font-size:16px}
.dayc button small{font-size:11px;color:var(--ink-2)}
.dayc button.run{border-color:var(--brand);background:var(--brand-tint)}
.dayc button.run small{color:var(--brand-ink);font-weight:600}
.dayc button[aria-current="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.dayc button[aria-current="true"] small{color:var(--on-brand)}
.areas{display:flex;flex-wrap:wrap;gap:6px}
.areas button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.areas button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
textarea{width:100%;min-height:220px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:14px/1.6 var(--font-body);padding:10px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--elev-3);max-width:calc(100% - 32px)}
.toast button{background:transparent;border:0;color:var(--bg);font-weight:700;min-height:36px;padding:0 10px;text-decoration:underline}

/* phone */
.mobile{display:none}
@media (max-width:760px){
  .board{display:none}
  .mobile{display:grid;gap:12px;margin-top:12px}
  .title{font-size:20px}
  .strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .strip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:2px;min-height:64px}
  .strip button b{font-family:var(--font-display);font-size:17px;line-height:1.1}
  .strip button small{font-size:10.5px;color:var(--ink-2)}
  .strip button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .strip button[aria-current="true"] small{color:var(--on-brand)}
  .strip .dot{width:7px;height:7px;border-radius:50%}
  .mday{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;display:grid;gap:8px}
  .mtabs{display:grid;grid-template-columns:1fr 1fr}
  .mtabs .seg{width:100%;grid-column:1/3}
  .mtabs .seg button{flex:1}
}
</style>

<div class="top">
  <div class="row1">
    <h1 class="title">จัดสายส่ง</h1>
    <span class="week" id="week"></span>
    <span class="sample">ข้อมูลตัวอย่าง</span>
    <span class="sp"></span>
    <div class="seg" role="group" aria-label="มุมมอง">
      <button type="button" id="v-cal" aria-pressed="true">ปฏิทิน</button>
      <button type="button" id="v-need" aria-pressed="false">ขวดที่ต้องมี</button>
    </div>
    <button type="button" class="btn primary" id="publish">ประกาศแผน</button>
  </div>
  <div class="row1">
    <div class="stats" id="stats"></div>
    <span class="sp"></span>
    <span class="pub" id="pubinfo"></span>
    <button type="button" class="btn ghost sm" id="reset">เริ่มใหม่</button>
  </div>
</div>

<main id="main"></main>
<div id="layer"></div>

      return el('div',{class:'it'},el('div',{class:'d'},itemText(x),el('small',{text:sub})),el('span',{class:'bags num',text:x.bags+' ถุง'}),el('span',{class:'tag '+ST_TAG[t],text:ST_LABEL[t]}))})));
    sh.appendChild(el('p',{class:'sl',text:'ส่งวันไหน'}));
    var dc=el('div',{class:'dayc'});
    for(var d=0;d<7;d++)(function(d){var run=pinned(d,o.area)&&!AREA[o.area].daily;dc.appendChild(el('button',{type:'button',class:run?'run':null,'aria-current':String(o.day===d),onclick:function(){move(o.id,d);openId=null;renderLayer()}},el('b',{text:dayLabel(d)}),el('small',{text:run?'สายนี้วิ่ง':' '})))})(d);
    dc.appendChild(el('button',{type:'button','aria-current':String(o.day==null),onclick:function(){move(o.id,null);openId=null;renderLayer()}},el('b',{text:'รอลงวัน'}),el('small',{text:' '})));

function shareText(){
  compute();
  var lines=['แผนส่ง '+dayLabel(0)+' – '+dayLabel(6)+' พ.ย.'];
  for(var d=0;d<7;d++){var sm=daySummary(d);if(!sm.tot)continue;
    var areas=[];sm.os.forEach(function(o){var n=AREA[o.area].name;if(areas.indexOf(n)<0)areas.push(n)});
    lines.push(dayLabel(d)+' · '+areas.join(' + ')+' · '+sm.os.length+' ร้าน '+sm.tot+' ถุง'+(sm.x?' (ขวดไม่พอ '+sm.x+' ถุง)':''));}
  var bk=Object.keys(NEED.blow);if(bk.length){lines.push('');lines.push('ต้องเป่าเพิ่ม');bk.forEach(function(s){var b=NEED.blow[s];lines.push('- '+SPEC[s].n+' '+b.bags+' ถุง '+(b.first>0?'ก่อน '+dayLabel(b.first-1):'ด่วนวันนี้'))})}
  var sk=Object.keys(NEED.screen).sort(function(a,b){return (+a.split('|')[0])-(+b.split('|')[0])});
  if(sk.length){lines.push('');lines.push('ต้องสกรีน');sk.forEach(function(k){var p=k.split('|');lines.push('- ส่ง '+dayLabel(+p[0])+' · '+SPEC[p[2]].n+' สกรีน'+p[1]+' '+NEED.screen[k]+' ถุง')})}
  var tray=S.orders.filter(function(o){return o.day==null}).length;if(tray){lines.push('');lines.push('ยังไม่ลงวัน '+tray+' ร้าน')}
  return lines.join('\n');
}
